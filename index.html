<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e14">
  <title>Tài Xỉu — Sun.win Style</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="sunwin-container">
    <!-- Header / Thanh thông tin người chơi -->
    <header class="sun-header">
      <div class="user-box">
        <div class="avatar">👑</div>
        <div class="user-info">
          <span class="username">Thành Viên Sun</span>
          <span class="balance" id="balance">10.000.000</span>
        </div>
      </div>
      <div class="room-title">
        <span>TÀI XỈU </span>
        <small>Phiên #<b id="round">0125</b></small>
      </div>
      <button id="reset" class="btn-reset" title="Nạp lại 10tr">🔄</button>
    </header>

    <!-- Khu vực chính bàn chơi Tài Xỉu -->
    <main class="sun-table">
      <!-- Bảng hiển thị thời gian & trạng thái -->
      <div class="table-status-bar">
        <span id="status" class="status-text">ĐANG ĐẶT CƯỢC</span>
        <div class="timer-badge" id="countdown">50s</div>
      </div>

      <!-- Hũ lắc xúc xắc (Bát & Đĩa phong cách Sunwin) -->
      <div class="bowl-container">
        <div class="dice-plate">
          <div class="dice-box" id="diceBox">
            <div class="die" id="die1">⚀</div>
            <div class="die" id="die2">⚁</div>
            <div class="die" id="die3">⚂</div>
          </div>
          <!-- Bát úp / Nút Mở Bát -->
          <div id="bowlCover" class="bowl-cover hidden">
            <span>ĐẬP BÁT / MỞ</span>
          </div>
        </div>
        <div class="total-result" id="totalResultBox">
          Tổng: <strong id="total">—</strong> <span id="resultLabel"></span>
        </div>
      </div>

      <!-- Cửa cược Tài / Xỉu lớn -->
      <div class="bet-gates">
        <!-- Cửa XỈU -->
        <button class="gate-btn xiu-gate" data-choice="xiu">
          <div class="gate-info">
            <span class="gate-name">XỈU</span>
            <span class="gate-desc">4 – 10 điểm</span>
          </div>
          <div class="my-bet-tag" id="myBetXiu">Cược: 0</div>
        </button>

        <!-- Cửa TÀI -->
        <button class="gate-btn tai-gate" data-choice="tai">
          <div class="gate-info">
            <span class="gate-name">TÀI</span>
            <span class="gate-desc">11 – 17 điểm</span>
          </div>
          <div class="my-bet-tag" id="myBetTai">Cược: 0</div>
        </button>
      </div>

      <!-- Thanh chọn phỉnh cược nhanh & điều khiển -->
      <div class="control-panel">
        <div class="chip-selector">
          <button class="chip active" data-chip="1000">1K</button>
          <button class="chip" data-chip="10000">10K</button>
          <button class="chip" data-chip="50000">50K</button>
          <button class="chip" data-chip="100000">100K</button>
          <button class="chip" data-chip="500000">500K</button>
          <button class="chip max" id="maxBet">TẤT TAY</button>
        </div>

        <div class="action-row">
          <div class="current-selected-bet">
            <span>Đang chọn cược:</span>
            <strong id="selectedBetDisplay">1.000</strong>
          </div>
          <button id="openBowlBtn" class="btn-open-bowl" style="display: none;">MỞ BÁT ⚡</button>
        </div>
      </div>
    </main>
